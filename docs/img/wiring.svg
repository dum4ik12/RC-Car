<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 760" width="1060" height="760" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .h     { font-size: 22px; font-weight: 600; fill: #24292f; }
    .box   { fill: #ffffff; stroke-width: 2; }
    .title { font-size: 15px; font-weight: 600; fill: #24292f; text-anchor: middle; }
    .pin   { font-size: 12px; fill: #57606a; }
    .pl { text-anchor: start; } .pr { text-anchor: end; } .pm { text-anchor: middle; }
    .w     { fill: none; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
    .sig { stroke: #0969da; } .v5 { stroke: #cf222e; } .v33 { stroke: #bc4c00; } .gnd { stroke: #24292f; }
    .bat { stroke: #cf222e; stroke-width: 5; } .batn { stroke: #24292f; stroke-width: 5; }
    .mot { stroke: #8250df; stroke-width: 5; }
    .rail  { font-size: 13px; font-weight: 600; fill: #24292f; text-anchor: end; }
    .note  { font-size: 13px; fill: #57606a; }
    .leg   { font-size: 13px; fill: #24292f; }
  </style>

  <rect width="1060" height="760" rx="16" fill="#ffffff" stroke="#d0d7de"/>
  <text x="60" y="40" class="h">How it's wired</text>

  <!-- ===== parts ===== -->

  <!-- ExpressLRS receiver -->
  <rect x="60" y="60" width="200" height="140" rx="8" class="box" stroke="#8250df"/>
  <text x="160" y="84" class="title">ExpressLRS receiver</text>
  <text x="250" y="109" class="pin pr">TX</text>
  <text x="250" y="134" class="pin pr">RX</text>
  <text x="250" y="159" class="pin pr">5V</text>
  <text x="250" y="184" class="pin pr">GND</text>
  <line x1="90" y1="170" x2="110" y2="120" stroke="#24292f" stroke-width="2" stroke-linecap="round"/>
  <circle cx="110" cy="120" r="3" fill="#24292f"/>
  <path d="M102 112 A11 11 0 0 1 118 112" fill="none" stroke="#8250df" stroke-width="2" stroke-linecap="round"/>
  <path d="M95 105 A19 19 0 0 1 125 105" fill="none" stroke="#8250df" stroke-width="2" stroke-linecap="round"/>

  <!-- ESP32 DevKit -->
  <rect x="380" y="60" width="230" height="380" rx="8" class="box" stroke="#1f6feb"/>
  <text x="495" y="84" class="title">ESP32 DevKit</text>
  <text x="390" y="109" class="pin pl">GPIO13</text>
  <text x="390" y="134" class="pin pl">GPIO17</text>
  <text x="600" y="109" class="pin pr">GPIO25</text>
  <text x="600" y="184" class="pin pr">GPIO26</text>
  <text x="600" y="209" class="pin pr">GPIO27</text>
  <text x="600" y="234" class="pin pr">GPIO15</text>
  <text x="600" y="259" class="pin pr">GPIO2</text>
  <text x="420" y="430" class="pin pm">VIN</text>
  <text x="470" y="430" class="pin pm">3V3</text>
  <text x="520" y="430" class="pin pm">GND</text>
  <rect x="440" y="300" width="110" height="70" rx="4" fill="#b1bac4" stroke="#8c959f" stroke-width="1.5"/>
  <text x="495" y="340" class="pin pm" fill="#24292f">WROOM-32</text>

  <!-- steering servo -->
  <rect x="740" y="60" width="200" height="80" rx="8" class="box" stroke="#bf8700"/>
  <text x="840" y="84" class="title">Steering servo</text>
  <text x="750" y="109" class="pin pl">Signal</text>
  <text x="930" y="104" class="pin pr">GND</text>
  <text x="930" y="129" class="pin pr">5V</text>

  <!-- brushed motor -->
  <rect x="740" y="165" width="160" height="50" rx="20" class="box" stroke="#8250df"/>
  <rect x="900" y="182" width="18" height="16" rx="3" fill="#8c959f"/>
  <text x="820" y="195" class="title">Brushed motor</text>

  <!-- BTS7960 motor driver -->
  <rect x="740" y="250" width="200" height="190" rx="8" class="box" stroke="#cf222e"/>
  <text x="930" y="306" class="title" style="text-anchor:end">BTS7960</text>
  <text x="930" y="324" class="pin pr">motor driver</text>
  <text x="750" y="304" class="pin pl">RPWM</text>
  <text x="750" y="334" class="pin pl">LPWM</text>
  <text x="750" y="364" class="pin pl">R_EN</text>
  <text x="750" y="394" class="pin pl">L_EN</text>
  <text x="790" y="266" class="pin pm">M+</text>
  <text x="850" y="266" class="pin pm">M−</text>
  <text x="930" y="384" class="pin pr">GND</text>
  <text x="930" y="414" class="pin pr">VCC</text>
  <text x="870" y="428" class="pin pm">B+</text>
  <text x="910" y="428" class="pin pm">B−</text>

  <!-- battery -->
  <rect x="790" y="470" width="150" height="50" rx="8" class="box" stroke="#1a7f37"/>
  <text x="800" y="500" class="title" style="text-anchor:start">Battery</text>
  <text x="870" y="486" class="pin pm">+</text>
  <text x="910" y="486" class="pin pm">−</text>
  <text x="820" y="514" class="pin pm">+</text>
  <text x="850" y="514" class="pin pm">−</text>

  <!-- 5 V regulator -->
  <rect x="790" y="545" width="150" height="70" rx="8" class="box" stroke="#57606a"/>
  <text x="865" y="585" class="title" font-size="13">5 V regulator (BEC)</text>
  <text x="820" y="561" class="pin pm">+</text>
  <text x="850" y="561" class="pin pm">−</text>
  <text x="820" y="607" class="pin pm">5V</text>
  <text x="860" y="607" class="pin pm">GND</text>

  <!-- ===== power rails ===== -->
  <path d="M70 650 H1035" class="w v5"  style="stroke-width:3.5"/>
  <path d="M70 680 H1035" class="w v33" style="stroke-width:3.5"/>
  <path d="M70 710 H1035" class="w gnd" style="stroke-width:3.5"/>
  <text x="62" y="654" class="rail">5 V</text>
  <text x="62" y="684" class="rail">3.3 V</text>
  <text x="62" y="714" class="rail">GND</text>

  <!-- ===== wires ===== -->

  <!-- radio data: receiver <-> ESP32 -->
  <path d="M260 105 H380" class="w sig"/>
  <path d="M260 130 H380" class="w sig"/>
  <text x="320" y="96" class="note" text-anchor="middle">radio data</text>

  <!-- servo signal -->
  <path d="M610 105 H740" class="w sig"/>

  <!-- motor driver signals -->
  <path d="M610 180 H695 V300 H740" class="w sig"/>
  <path d="M610 205 H680 V330 H740" class="w sig"/>
  <path d="M610 230 H665 V360 H740" class="w sig"/>
  <path d="M610 255 H650 V390 H740" class="w sig"/>

  <!-- 10 k pull-down on L_EN -->
  <path d="M720 390 V480" class="w gnd"/>
  <rect x="712" y="480" width="16" height="44" fill="#ffffff" stroke="#24292f" stroke-width="2"/>
  <path d="M720 524 V710" class="w gnd"/>
  <circle cx="720" cy="390" r="4" fill="#0969da"/>
  <text x="704" y="500" class="pin pr">10 kΩ</text>
  <text x="704" y="515" class="pin pr">pull-down</text>

  <!-- motor leads -->
  <path d="M790 250 V215" class="w mot"/>
  <path d="M850 250 V215" class="w mot"/>

  <!-- battery power -->
  <path d="M870 440 V470" class="w bat"/>
  <path d="M910 440 V470" class="w batn"/>
  <path d="M820 520 V545" class="w bat"/>
  <path d="M850 520 V545" class="w batn"/>

  <!-- 5 V -->
  <path d="M260 155 H300 V650" class="w v5"/>
  <path d="M420 440 V650" class="w v5"/>
  <path d="M940 125 H1000 V650" class="w v5"/>
  <path d="M820 615 V650" class="w v5"/>

  <!-- 3.3 V -->
  <path d="M470 440 V680" class="w v33"/>
  <path d="M940 410 H970 V680" class="w v33"/>

  <!-- ground -->
  <path d="M260 180 H320 V710" class="w gnd"/>
  <path d="M520 440 V710" class="w gnd"/>
  <path d="M940 380 H985 V710" class="w gnd"/>
  <path d="M940 100 H1015 V710" class="w gnd"/>
  <path d="M860 615 V710" class="w gnd"/>

  <!-- junctions on the rails -->
  <g fill="#cf222e">
    <circle cx="300" cy="650" r="4.5"/><circle cx="420" cy="650" r="4.5"/>
    <circle cx="1000" cy="650" r="4.5"/><circle cx="820" cy="650" r="4.5"/>
  </g>
  <g fill="#bc4c00">
    <circle cx="470" cy="680" r="4.5"/><circle cx="970" cy="680" r="4.5"/>
  </g>
  <g fill="#24292f">
    <circle cx="320" cy="710" r="4.5"/><circle cx="520" cy="710" r="4.5"/>
    <circle cx="985" cy="710" r="4.5"/><circle cx="1015" cy="710" r="4.5"/>
    <circle cx="860" cy="710" r="4.5"/><circle cx="720" cy="710" r="4.5"/>
  </g>

  <!-- pins -->
  <g fill="#ffffff" stroke-width="2">
    <!-- receiver -->
    <circle cx="260" cy="105" r="4.5" stroke="#0969da"/><circle cx="260" cy="130" r="4.5" stroke="#0969da"/>
    <circle cx="260" cy="155" r="4.5" stroke="#cf222e"/><circle cx="260" cy="180" r="4.5" stroke="#24292f"/>
    <!-- ESP32 -->
    <circle cx="380" cy="105" r="4.5" stroke="#0969da"/><circle cx="380" cy="130" r="4.5" stroke="#0969da"/>
    <circle cx="610" cy="105" r="4.5" stroke="#0969da"/><circle cx="610" cy="180" r="4.5" stroke="#0969da"/>
    <circle cx="610" cy="205" r="4.5" stroke="#0969da"/><circle cx="610" cy="230" r="4.5" stroke="#0969da"/>
    <circle cx="610" cy="255" r="4.5" stroke="#0969da"/>
    <circle cx="420" cy="440" r="4.5" stroke="#cf222e"/><circle cx="470" cy="440" r="4.5" stroke="#bc4c00"/>
    <circle cx="520" cy="440" r="4.5" stroke="#24292f"/>
    <!-- servo -->
    <circle cx="740" cy="105" r="4.5" stroke="#0969da"/>
    <circle cx="940" cy="100" r="4.5" stroke="#24292f"/><circle cx="940" cy="125" r="4.5" stroke="#cf222e"/>
    <!-- motor -->
    <circle cx="790" cy="215" r="4.5" stroke="#8250df"/><circle cx="850" cy="215" r="4.5" stroke="#8250df"/>
    <!-- BTS7960 -->
    <circle cx="740" cy="300" r="4.5" stroke="#0969da"/><circle cx="740" cy="330" r="4.5" stroke="#0969da"/>
    <circle cx="740" cy="360" r="4.5" stroke="#0969da"/><circle cx="740" cy="390" r="4.5" stroke="#0969da"/>
    <circle cx="790" cy="250" r="4.5" stroke="#8250df"/><circle cx="850" cy="250" r="4.5" stroke="#8250df"/>
    <circle cx="940" cy="380" r="4.5" stroke="#24292f"/><circle cx="940" cy="410" r="4.5" stroke="#bc4c00"/>
    <circle cx="870" cy="440" r="4.5" stroke="#cf222e"/><circle cx="910" cy="440" r="4.5" stroke="#24292f"/>
    <!-- battery -->
    <circle cx="870" cy="470" r="4.5" stroke="#cf222e"/><circle cx="910" cy="470" r="4.5" stroke="#24292f"/>
    <circle cx="820" cy="520" r="4.5" stroke="#cf222e"/><circle cx="850" cy="520" r="4.5" stroke="#24292f"/>
    <!-- regulator -->
    <circle cx="820" cy="545" r="4.5" stroke="#cf222e"/><circle cx="850" cy="545" r="4.5" stroke="#24292f"/>
    <circle cx="820" cy="615" r="4.5" stroke="#cf222e"/><circle cx="860" cy="615" r="4.5" stroke="#24292f"/>
  </g>

  <!-- ===== legend ===== -->
  <text x="60" y="262" class="leg" font-weight="600">Wires</text>
  <path d="M60 285 H100" class="w sig"/>  <text x="110" y="289" class="leg">Signal from the ESP32</text>
  <path d="M60 310 H100" class="w v5"/>   <text x="110" y="314" class="leg">5 V</text>
  <path d="M60 335 H100" class="w v33"/>  <text x="110" y="339" class="leg">3.3 V</text>
  <path d="M60 360 H100" class="w gnd"/>  <text x="110" y="364" class="leg">Ground</text>
  <path d="M60 385 H100" class="w bat"/>  <text x="110" y="389" class="leg">Battery power</text>
  <path d="M60 410 H100" class="w mot"/>  <text x="110" y="414" class="leg">Motor power</text>
  <text x="60" y="450" class="note">All grounds are joined together.</text>
  <text x="60" y="470" class="note">The 10 kΩ resistor keeps the motor</text>
  <text x="60" y="488" class="note">off while the board starts up.</text>
</svg>
