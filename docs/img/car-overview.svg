<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .h  { font-size: 22px; font-weight: 600; fill: #24292f; }
    .s  { font-size: 13px; fill: #57606a; }
    .l  { font-size: 15px; font-weight: 600; fill: #24292f; text-anchor: middle; }
    .ls { font-size: 13px; fill: #57606a; text-anchor: middle; }
    .w  { font-size: 13px; font-weight: 600; fill: #ffffff; text-anchor: middle; }
    .lead { stroke: #8c959f; stroke-width: 1.5; stroke-dasharray: 4 3; fill: none; }
  </style>

  <rect width="1000" height="560" rx="16" fill="#ffffff" stroke="#d0d7de"/>
  <text x="32" y="40" class="h">What's on the car</text>
  <text x="32" y="60" class="s">Top view, not to scale. The front of the car is on the right.</text>

  <!-- the transmitter in your hands -->
  <g>
    <rect x="850" y="60" width="90" height="56" rx="8" fill="#57606a"/>
    <circle cx="875" cy="88" r="10" fill="#24292f" stroke="#afb8c1" stroke-width="2"/>
    <circle cx="915" cy="88" r="10" fill="#24292f" stroke="#afb8c1" stroke-width="2"/>
    <line x1="925" y1="60" x2="940" y2="34" stroke="#24292f" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="940" cy="34" r="3" fill="#24292f"/>
    <path d="M931.3 29 A10 10 0 0 1 948.7 29" fill="none" stroke="#8250df" stroke-width="2" stroke-linecap="round"/>
    <path d="M924.4 25 A18 18 0 0 1 955.6 25" fill="none" stroke="#8250df" stroke-width="2" stroke-linecap="round"/>
    <text x="895" y="140" class="ls">Your radio</text>
  </g>

  <!-- chassis and axles -->
  <rect x="170" y="170" width="620" height="250" rx="28" fill="#eef1f4" stroke="#afb8c1" stroke-width="2"/>
  <line x1="250" y1="200" x2="250" y2="390" stroke="#c8ced5" stroke-width="6"/>
  <line x1="720" y1="200" x2="720" y2="390" stroke="#c8ced5" stroke-width="6"/>

  <!-- steering linkage (drawn under the servo) -->
  <line x1="730" y1="280" x2="722" y2="216" stroke="#8c959f" stroke-width="4" stroke-linecap="round"/>
  <line x1="730" y1="310" x2="722" y2="374" stroke="#8c959f" stroke-width="4" stroke-linecap="round"/>

  <!-- wheels: front pair turned a little -->
  <g fill="#24292f">
    <rect x="228" y="120" width="44" height="96" rx="10"/>
    <rect x="228" y="374" width="44" height="96" rx="10"/>
    <rect x="698" y="120" width="44" height="96" rx="10" transform="rotate(-14 720 168)"/>
    <rect x="698" y="374" width="44" height="96" rx="10" transform="rotate(-14 720 422)"/>
  </g>
  <g fill="#3d444d">
    <rect x="236" y="128" width="28" height="80" rx="6"/>
    <rect x="236" y="382" width="28" height="80" rx="6"/>
    <rect x="706" y="128" width="28" height="80" rx="6" transform="rotate(-14 720 168)"/>
    <rect x="706" y="382" width="28" height="80" rx="6" transform="rotate(-14 720 422)"/>
  </g>

  <!-- brushed motor on the rear axle -->
  <rect x="262" y="250" width="100" height="56" rx="12" fill="#57606a" stroke="#424a53" stroke-width="2"/>
  <rect x="270" y="257" width="84" height="9" rx="4" fill="#6e7781"/>
  <circle cx="250" cy="278" r="16" fill="#8c959f" stroke="#57606a" stroke-width="2"/>
  <circle cx="250" cy="278" r="5" fill="#eef1f4"/>

  <!-- motor driver (red board with a heat sink) -->
  <rect x="385" y="190" width="120" height="90" rx="6" fill="#cf222e" stroke="#a40e26" stroke-width="2"/>
  <rect x="395" y="200" width="100" height="26" rx="3" fill="#8c959f"/>
  <g stroke="#d0d7de" stroke-width="2">
    <line x1="405" y1="200" x2="405" y2="226"/><line x1="415" y1="200" x2="415" y2="226"/>
    <line x1="425" y1="200" x2="425" y2="226"/><line x1="435" y1="200" x2="435" y2="226"/>
    <line x1="445" y1="200" x2="445" y2="226"/><line x1="455" y1="200" x2="455" y2="226"/>
    <line x1="465" y1="200" x2="465" y2="226"/><line x1="475" y1="200" x2="475" y2="226"/>
    <line x1="485" y1="200" x2="485" y2="226"/>
  </g>
  <text x="445" y="262" class="w">Motor driver</text>

  <!-- ESP32 board -->
  <rect x="530" y="190" width="150" height="80" rx="6" fill="#24292f" stroke="#000000" stroke-width="2"/>
  <rect x="522" y="222" width="12" height="16" rx="2" fill="#8c959f"/>
  <rect x="545" y="205" width="60" height="40" rx="3" fill="#b1bac4" stroke="#8c959f" stroke-width="1.5"/>
  <path d="M596 210 v6 h-5 v6 h5 v6 h-5 v6" fill="none" stroke="#57606a" stroke-width="1.5"/>
  <text x="642" y="232" class="w" font-size="14">ESP32</text>
  <text x="642" y="250" class="w" font-size="11" font-weight="400">the brain</text>

  <!-- battery -->
  <rect x="290" y="320" width="170" height="70" rx="10" fill="#0969da" stroke="#0550ae" stroke-width="2"/>
  <rect x="302" y="332" width="146" height="46" rx="6" fill="#218bff" opacity="0.6"/>
  <rect x="460" y="343" width="20" height="24" rx="3" fill="#d4a72c" stroke="#9a6700" stroke-width="1.5"/>
  <text x="375" y="360" class="w">Battery</text>

  <!-- radio receiver with antenna -->
  <rect x="500" y="335" width="80" height="46" rx="5" fill="#8250df" stroke="#6639ba" stroke-width="2"/>
  <text x="540" y="362" class="w" font-size="12">Receiver</text>
  <line x1="576" y1="340" x2="602" y2="310" stroke="#24292f" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="602" cy="310" r="3" fill="#24292f"/>
  <g fill="none" stroke="#8250df" stroke-width="2" stroke-linecap="round">
    <path d="M598.9 298.4 A12 12 0 0 1 613.6 313.1"/>
    <path d="M596.8 290.7 A20 20 0 0 1 621.3 315.2"/>
    <path d="M594.7 283 A28 28 0 0 1 629 317.3"/>
  </g>

  <!-- steering servo -->
  <rect x="700" y="272" width="60" height="46" rx="5" fill="#bf8700" stroke="#9a6700" stroke-width="2"/>
  <circle cx="730" cy="295" r="8" fill="#ffffff" stroke="#9a6700" stroke-width="2"/>

  <!-- labels above -->
  <text x="312" y="92" class="l">Brushed motor</text>
  <text x="312" y="110" class="ls">turns the rear wheels</text>
  <line x1="312" y1="118" x2="312" y2="250" class="lead"/>

  <text x="445" y="92" class="l">Motor driver</text>
  <text x="445" y="110" class="ls">feeds the motor</text>
  <line x1="445" y1="118" x2="445" y2="190" class="lead"/>

  <text x="605" y="92" class="l">ESP32 board</text>
  <text x="605" y="110" class="ls">the brain, runs the code</text>
  <line x1="605" y1="118" x2="605" y2="190" class="lead"/>

  <!-- labels below -->
  <line x1="375" y1="390" x2="375" y2="482" class="lead"/>
  <text x="375" y="500" class="l">Battery</text>
  <text x="375" y="518" class="ls">powers everything</text>

  <line x1="540" y1="381" x2="540" y2="482" class="lead"/>
  <text x="540" y="500" class="l">Radio receiver</text>
  <text x="540" y="518" class="ls">hears your radio</text>

  <!-- label right -->
  <line x1="760" y1="295" x2="810" y2="295" class="lead"/>
  <text x="820" y="290" class="l" style="text-anchor:start">Steering servo</text>
  <text x="820" y="308" class="ls" style="text-anchor:start">turns the front wheels</text>
</svg>
