; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev            ; `pio run` builds the firmware only; the native env is for `pio test -e native`

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_unflags =
	-std=gnu++11
	-Os
build_flags =
	-std=gnu++17
	-O2
	-DCORE_DEBUG_LEVEL=3
build_src_flags =
	-Wall
	-Wextra
test_ignore = test_*               ; the unit tests are host-only; never build or upload them to the board

; Host unit tests for the hardware-free libraries (CrsfProtocol, Control).
; Needs a host GCC on PATH (Windows: MSYS2 ucrt64). Run with `pio test -e native`.
[env:native]
platform = native
test_framework = unity
build_flags =
	-std=gnu++17
	-Wall
	-Wextra
lib_ignore =
	Actuators
	Radio
